name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    # Trusted publishing (OIDC): no API token is stored in the repo.
    # Configure the publisher once at https://pypi.org/manage/account/publishing/
    # (owner: r8, repository: redeflacue, workflow: release.yml, environment: pypi).
    # Docs: https://docs.pypi.org/trusted-publishers/adding-a-publisher/
    environment:
      name: pypi
      url: https://pypi.org/p/redeflacue
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the pushed tag

      - uses: astral-sh/setup-uv@v10

      - run: uv build

      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl redeflacue --version

      - run: uv publish --trusted-publishing always
