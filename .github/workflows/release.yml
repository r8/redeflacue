name: Release

on:
  push:
    tags: ["v*"]

jobs:
  pypi:
    name: Build and publish to PyPI
    runs-on: ubuntu-latest
    # PyPI trusted publisher: r8/redeflacue, release.yml, environment pypi.
    environment:
      name: pypi
      url: https://pypi.org/p/redeflacue
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from the pushed tag

      - uses: astral-sh/setup-uv@v10

      - run: uv build

      - name: Smoke-test the wheel
        run: uv run --isolated --no-project --with dist/*.whl redeflacue --version

      - run: uv publish --trusted-publishing always
