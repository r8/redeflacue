name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: py${{ matrix.python-version }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # hatch-vcs derives the version from git tags

      - uses: astral-sh/setup-uv@v10
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }} # exported as UV_PYTHON

      - name: Install sox (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y sox libsox-fmt-all

      - name: Install sox (macOS)
        if: runner.os == 'macOS'
        run: brew install sox

      - run: uv sync --frozen
      - run: uv run ruff check
      - run: uv run ruff format --check
      - run: uv run mypy src
      - run: uv run pytest --cov --cov-report=xml

      - name: Upload coverage
        uses: codecov/codecov-action@v7
        with:
          files: coverage.xml
          flags: py${{ matrix.python-version }}-${{ matrix.os }}
          fail_ci_if_error: false
          # Optional: add CODECOV_TOKEN under Settings -> Secrets and variables -> Actions
          # (required by Codecov for private repos, recommended for public ones).
          token: ${{ secrets.CODECOV_TOKEN }}
